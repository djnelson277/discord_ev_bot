# Pinned because the crate uses edition 2024, which needs rustc >= 1.85.
# Build images often ship something older, and the failure is a confusing
# edition error rather than an obvious "your Rust is too old".
#
# Keep this reasonably current. It was briefly pinned to 1.92, which by then was
# eleven months and nine releases old -- chosen by mistake from whatever happened
# to be installed locally rather than from what was actually current. Editors
# ship a modern rust-analyzer and refuse to use an ancient toolchain's, so the
# stale pin cost working autocomplete and inline diagnostics until it surfaced.
#
# rust-analyzer, rustfmt and clippy are listed explicitly because
# `profile = "minimal"` omits all three.
[toolchain]
channel = "1.99"
profile = "minimal"
components = ["rust-analyzer", "rustfmt", "clippy"]
