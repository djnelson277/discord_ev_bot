# Operator criteria. Every value here is changeable at runtime.
# Env vars prefixed EVBOT_ override these (e.g. EVBOT_MIN_EV_PCT=5.0).

owls_base_url = "https://api.owlsinsight.com"

# Alert only on EV strictly greater than this, in percent.
min_ev_pct = 2.5

poll_interval_secs = 60
gating_refresh_secs = 3600

# How often the ops channel gets a "here is what I saw" report. Silence is this
# bot's normal state, so the heartbeat is what distinguishes "watching, market
# is tight" from "crashed". Absence of it is the alarm.
heartbeat_secs = 1800

# A sport is "active" if it has an unstarted game within this many hours.
lookahead_hours = 48

sports = [
  "nfl", "nba", "mlb", "nhl", "ncaaf",
  "ncaab", "wnba", "soccer", "tennis", "mma",
]

# Books the operator holds funded accounts at. Alerting on a book you cannot
# bet is noise that trains people to ignore the channel.
#
# Adding one is a config change only -- the code validates against the API's
# book universe, not against this list.
books = [
  "betmgm", "fanduel", "draftkings", "caesars", "circa",
  "novig", "kalshi", "polymarket",
  # bet365 is absent from the consensus /odds board in live sampling, so the
  # poller may never be able to alert on it, even though the ev.found webhook
  # allowlist accepts it. Left in pending confirmation.
  "bet365",
]

# Optional. When set, opportunities with a known lower consensus count are
# rejected. An absent count always publishes (fail open, marked).
# min_books_in_consensus = 2
